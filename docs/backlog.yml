      Federal Register, https://www.federalregister.gov/documents/2026/08/07/2026-16095/; Moller et al. 2026 (SEDAR105-WP-12); SEDAR 105, https://sedarweb.org/assessments/sedar-105/

  - id: 17
    title: "R4EwE: pkgdown site, restore the vignette as .Rmd, and write usage vignettes"
    objective: "III. Communication"
    stakeholder: ["D. Ecosystem modelers", "E. Science community"]
