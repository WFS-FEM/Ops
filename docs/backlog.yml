# Initial backlog for the WFS-FEM Operationalization project (draft 3, 14 Sept 2026).
# Field values must match the project's option labels exactly.
# objective: I. Automation | II. Integration | III. Communication | PM (project management)
# stakeholder (multi): A. SEFSC Gulf Fisheries Branch / SEDAR | B. Gulf IEA / ESR | C. Fisheries managers |
#   D. Ecosystem modelers | E. Science community | F. Fishers and public | G. Funder (NOAA RESTORE reporting) | H. Other
# product (multi): A. EwE model update | B. SEDAR Mrt | C. Shiny App | D. R package | E. IEA/ESR |
#   F. Peer-reviewed paper | G. Report | H. Other
# priority: P0 critical path | P1 high | P2 normal | P3 nice to have
# phase: 2026 Q4 ... 2028 Q3 | Beyond award
# lead: Holden | Dave | Other
# milestone: title as created in WFS-FEM/Ops

issues:
  - id: 1
    title: "Expand the one-page plan into a transition plan (scope, success criteria, timeline)"
    objective: "PM (project management)"
    stakeholder: ["G. Funder (NOAA RESTORE reporting)"]
    product: ["G. Report"]
    priority: "P0 critical path"
    phase: "2026 Q4"
    lead: Holden
    milestone: "M1 Fall 2026 stakeholder meetings"
    labels: [docs]
    partner: ""
    body: |
      ## Context
      The one-pager ("Operational = Automated + Integrated + Communicated") is a good vision statement but not yet a plan: it does not state scope, what "operational" looks like when achieved, who does what by when, or what could stop it. NOAA's NAO 216-105B recommends a *transition plan* (an agreement between researchers and users) for any R&D product progressing beyond readiness level 4. The WFS-FEM is at roughly RL 7 (prototype demonstrated in an operational environment: SEDAR 72 projections in 2021, SEDAR 88 selectivity in 2025); the plan's job is to describe the path to RL 9 (deployed and used routinely). The proposal's own definition applies: operational means "protocols and formats that enable routine updates and reproducible model runs by more than just the developers."

      ## Acceptance criteria
      - [ ] Sections: scope (stocks in and out), success criteria, timeline to Sept 2028, roles (Chagaris, Harris, Hu, Stukel, Kranz, SEFSC analysts), risks
      - [ ] Traceable to the NOAA RESTORE award deliverables and named end users (#2)
      - [ ] Reviewed by Dave; shared with SEFSC partners for comment
      - [ ] Committed to `docs/` in this repository

      ## Sources
      NAO 216-105B, https://www.noaa.gov/organization/administration/nao-216-105b-policy-on-research-and-development-transitions; Sagarese et al. 2026 (SEDAR105-WP-09); Turley et al. 2026, https://doi.org/10.1007/s11160-026-10052-5

