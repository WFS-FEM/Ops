  - id: 4
    title: "Build an automated satellite red tide feed with the Hu lab"
    objective: "I. Automation"
    stakeholder: ["D. Ecosystem modelers"]
    product: ["A. EwE model update"]
    priority: "P0 critical path"
    phase: "2027 Q2"
    lead: Holden
    milestone: "M4 Automated monthly satellite feed operational"
    labels: [code, pipeline]
    partner: "Hu lab (USF Optical Oceanography Lab)"
    body: |
      ## Context
      The satellite footprint is the weak link in the monthly red tide layer. RedTideMaps tracks VIIRS rasters only through 2024-12 and `process_VIIRS.R` contains no download step, so new months depend on files obtained by hand from the USF Optical Oceanography Lab. MODIS Aqua nFLH (the second option in the VIIRS > MODIS nFLH > buffered-hull cascade) will not remain a fallback: Aqua entered free drift in Dec 2021 and NASA's status page projects operation only into 2026. Sagarese et al. (2026) note that FLH is not measured by VIIRS and that new detection and severity methods will be required. Award task 2.3 (operationalize VIIRS red tide map development, 2025 to 2028) is the Hu lab's side of this.

      ## Acceptance criteria
      - [ ] Agreement with the Hu lab on a product, format, cadence and delivery mechanism (e.g., monthly VIIRS bloom-detection rasters via a stable URL or API)
      - [ ] `process_VIIRS.R` (or successor) downloads the current month without manual steps
      - [ ] Fallback behaviour when the feed is missing is documented and tested with a simulated outage
      - [ ] Data-currency stamp written with each monthly run

      ## Sources
      WFS-FEM/RedTideMaps; Yao et al. 2026, https://doi.org/10.1016/j.rse.2026.115345; Sagarese et al. 2026 (SEDAR105-WP-09); NASA Aqua status, https://aqua.nasa.gov/

