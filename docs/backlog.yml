  - id: 15
    title: "Finalize the deliverables table"
    objective: "II. Integration"
    stakeholder: ["A. SEFSC Gulf Fisheries Branch / SEDAR"]
    product: ["B. SEDAR Mrt"]
    priority: "P0 critical path"
    phase: "2026 Q4"
    lead: Holden
    milestone: "M1 Fall 2026 stakeholder meetings"
    labels: [docs]
    partner: ""
    body: |
      ## Context
      "Inform stock assessment reference points" is narrower than the ways WFS-FEM output is actually used or requested:
      1. Which years get a non-zero red tide fleet (bycatch-fleet approach; SEDAR105-WP-12): needs a year-by-year severity flag with a stated threshold.
      2. Age-specific selectivity of the red tide fleet (SEDAR 88 WP, Table 2): needs rescaled age vectors per event year.
      3. Short-term projection scenarios (SEDAR 72 precedent): needs monthly Mrt through the current month, with uncertainty, on the SSC calendar.
      4. A baseline red tide mortality for reference-point projections (SEDAR105-WP-09 recommends including it in every projection year): the 2002 to present series is a natural source.
      5. Validation of an "extra mortality fleet" estimated in all years (SEDAR105-WP-12).

      ## Acceptance criteria
      - [ ] Table: use case, output, format, uncertainty, deadline, recipient
      - [ ] Reviewed with the assessment group (#11)
      - [ ] Committed to `docs/`

      ## Sources
      Moller et al. 2026 (SEDAR105-WP-12); Sagarese et al. 2026 (SEDAR105-WP-09); Chagaris 2025 (SEDAR 88 WP)

