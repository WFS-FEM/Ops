      SEDAR 105 (gag) is the live opportunity. Its Red Tide Mortality TWG met on 8 Sept 2026 and completion is expected late 2026. SEDAR105-WP-12 tentatively recommends an extra-mortality fleet estimated in all years and notes that the Ecospace index (Chagaris 2025) could validate red tide events.

