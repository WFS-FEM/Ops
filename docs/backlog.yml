  - id: 7
    title: "Create an orchestration workflow that runs the monthly pipeline end to end and logs each run"
    objective: "I. Automation"
    stakeholder: ["D. Ecosystem modelers"]
    product: ["A. EwE model update"]
    priority: "P0 critical path"
    phase: "2026 Q4"
    lead: Holden
    milestone: "M2 Monthly pipeline reproducible"
    labels: [code, pipeline, decision]
    partner: ""
    body: |
      ## Context
      Pieces exist (RedTideMaps builds the red tide driver in seconds; R4EwE drives EwE; EcospaceBasemap builds static layers; the EnvironmentalDrivers2EwE, Survey2EwE and SS2EwE repositories cover other inputs) but nothing runs them in sequence, records what ran with which inputs and versions, and publishes the outputs. This is the "living model" in Objective I. The EwE console is a Windows application, so the automated workflow needs a Windows host (scheduled task or self-hosted runner).

      ## Decision needed
      Where the orchestration lives: this repository, a new `WFS-FEM/Pipeline` repository, or inside RedTideMaps; and which Windows host runs it.

      ## Acceptance criteria
      - [ ] One entry point (R script or `targets` pipeline) that: refreshes drivers, runs the Ecospace scenario ensemble, exports products, and writes a run log (date, input data currency, model database version, R4EwE version, git commit)
      - [ ] Runs on a schedule on a Windows host with EwE installed
      - [ ] Failure of any step produces a readable error and does not overwrite the last good products
      - [ ] Decision recorded in `docs/decisions.md`

  - id: 8
