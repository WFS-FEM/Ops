    milestone: "M6 R package (R4EwE v1.0)"
    labels: [docs]
    partner: ""
    body: |
      ## Context
      As of Sept 2026 the package has 75 exported functions, a README, a PDF manual and an MIT license, but no tests, no CI and no pkgdown site, and the only vignette was renamed from .Rmd to .md, so `R CMD build` produces no vignettes. "Usage vignettes" is a listed product and needs an author and time. Two sentences worth adding to the README: R4EwE drives the EwE software from R, which distinguishes it from NOAA's Rpath (an R reimplementation of EwE), and the name echoes r4ss.

      ## Acceptance criteria
      - [ ] Vignette restored as .Rmd and building
      - [ ] At least two usage vignettes: (1) run an Ecospace scenario ensemble and summarize Mrt; (2) build and write a monthly driver
      - [ ] pkgdown site deployed via GitHub Pages
      - [ ] (stretch) `testthat` suite and GitHub Actions R CMD check

      ## Sources
      https://github.com/dchagaris/R4EwE; Rpath, https://noaa-edab.github.io/Rpath/

