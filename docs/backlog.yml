  - id: 9
    title: "Integrate hypoxia and BGC drivers from NEMURO-GOM (contingent on model performance)"
    objective: "I. Automation"
    stakeholder: ["B. Gulf IEA / ESR", "D. Ecosystem modelers"]
    product: ["A. EwE model update", "E. IEA/ESR"]
    priority: "P2 normal"
    phase: "2028 Q1"
    lead: Holden
    milestone: "M5 Automated monthly BGC model feed operational"
    labels: [EwE, pipeline]
    partner: "Mike Stukel (FSU), Sven Kranz (FSU)"
    body: |
      ## Context
      The model omits hypoxia for lack of dissolved-oxygen drivers (Vilas et al. 2023), which is part of why the Ecospace index and fishermen's LEK disagree for 2014 and 2018 (SEDAR105-WP-12; Turley et al. 2026). The award's biogeochemical component (NEMURO-GOM with K. brevis and oxygen; tasks 3.3 and 3.4) is meant to supply those drivers, and the proposal promised statistical linkages so that users need not run NEMURO-GOM themselves.

      ## Acceptance criteria
      - [ ] Status check with Stukel and Kranz on the BGC model, its outputs and delivery cadence
      - [ ] If usable: DO or hypoxia layer added to the driver pipeline (#8) and a sensitivity run reported
      - [ ] If not: documented as a limitation in the transition plan and products

      ## Sources
      Vilas et al. 2023, https://doi.org/10.1038/s41598-023-29327-z; Moller et al. 2026 (SEDAR105-WP-12); Turley et al. 2026

